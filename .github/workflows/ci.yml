name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      base: ${{ steps.classify.outputs.base }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: classify
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          base="$EVENT_BASE_SHA"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-count=1 HEAD^)"
          fi

          heavy=false
          while IFS= read -r path; do
            case "$path" in
              docs/*|*.md|LICENSE|LICENSE.*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE*) ;;
              *) heavy=true; break ;;
            esac
          done < <(git diff --name-only "$base" "$GITHUB_SHA")

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation check
    needs: changes
    if: needs.changes.outputs.heavy != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check documentation changes
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: |
          git diff --check "$BASE_SHA" "$GITHUB_SHA"
          python3 tools/check_repository.py

  test:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cpu.txt
          python -m pip install 'pytest>=9,<10' 'ruff>=0.12,<1'

      - name: Install Node dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check repository boundary
        run: python tools/check_repository.py

      - name: Protect GitHub README and license
        if: github.event_name == 'pull_request'
        run: python tools/check_repository.py --compare-ref "${{ github.event.pull_request.base.sha }}"

      - name: Check runtime prerequisites
        run: python tools/doctor.py --profile visual

      - name: Verify generated UI runtimes
        run: |
          npm run build:ui-runtime
          git diff --exit-code -- static/thinking-orbs.js static/generative-loaders.js static/generative-loaders.css static/border-beam.js static/ui-icons.js

      - name: Compile Python sources
        run: python -m compileall -q app tools

      - name: Run static analysis
        run: npm run lint

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run browser tests
        run: npm run test:frontend

      - name: Run offline quality gate
        run: npm run benchmark:quality

  docker:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HIGHLIGHT_ACCESS_TOKEN: github-actions-local-token-32chars
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare non-secret Compose environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet

      - name: Build and start CPU image
        run: docker compose up --build --detach

      - name: Wait for health check
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:5180/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Smoke test installed CPU capabilities
        run: docker compose exec -T cliptalk python tools/container_smoke.py

      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes

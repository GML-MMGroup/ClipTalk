name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check repository boundary
        run: python tools/check_repository.py

      - name: Protect GitHub README and license
        if: github.event_name == 'pull_request'
        run: python tools/check_repository.py --compare-ref "${{ github.event.pull_request.base.sha }}"

      - name: Check runtime prerequisites
        run: python tools/doctor.py --profile visual

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run browser tests
        run: npm run test:frontend

      - name: Run offline quality gate
        run: npm run benchmark:quality

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HIGHLIGHT_ACCESS_TOKEN: github-actions-local-token-32chars
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare non-secret Compose environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start CPU image
        run: docker compose up --build --detach

      - name: Wait for health check
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:5180/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes

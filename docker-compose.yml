services:
  cliptalk:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CLIPTALK_INSTALL_PROFILE: ${CLIPTALK_INSTALL_PROFILE:-cpu}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:5180:5180"
    environment:
      HIGHLIGHT_HOST: 0.0.0.0
      HIGHLIGHT_PORT: 5180
      HIGHLIGHT_DATA_ROOT: /app/data
      # The published port is loopback-only, so a clean local deployment does
      # not need a login token. Set HIGHLIGHT_ACCESS_TOKEN before exposing the
      # service through a reverse proxy or a non-loopback host port.
      HIGHLIGHT_ACCESS_TOKEN: ${HIGHLIGHT_ACCESS_TOKEN:-}
      HIGHLIGHT_ALLOW_UNAUTHENTICATED_REMOTE: ${HIGHLIGHT_ALLOW_UNAUTHENTICATED_REMOTE:-true}
      CLIPTALK_AGENT_SERVICE_URL: http://agent:5190
      # When empty, both services atomically share an auto-generated token from
      # the cliptalk-data volume.
      CLIPTALK_AGENT_SERVICE_TOKEN: ${CLIPTALK_AGENT_SERVICE_TOKEN:-}
    volumes:
      - cliptalk-data:/app/data
    depends_on:
      agent:
        condition: service_healthy
    shm_size: "1gb"
    restart: unless-stopped

  agent:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    environment:
      CLIPTALK_AGENT_HOST: 0.0.0.0
      CLIPTALK_AGENT_PORT: 5190
      CLIPTALK_AGENT_SERVICE_TOKEN: ${CLIPTALK_AGENT_SERVICE_TOKEN:-}
      HIGHLIGHT_DATA_ROOT: /app/data
    volumes:
      - cliptalk-data:/app/data
    restart: unless-stopped

volumes:
  cliptalk-data:
